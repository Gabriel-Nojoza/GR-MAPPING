name: gr-mapping

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8001}:8000"
    env_file:
      - .env.vps
    environment:
      MEDICAO_DB_PATH: /data/dados.db
      MEDICAO_UPLOADS_DIR: /data/uploads
      EVOLUTION_API_URL: http://evolution:8080
    volumes:
      - gr_mapping_data:/data

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-3001}:3000"
    depends_on:
      - api

  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    env_file:
      - .env.vps
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${EVOLUTION_DB_USER}:${EVOLUTION_DB_PASSWORD}@evolution-postgres:5432/${EVOLUTION_DB_NAME}?schema=evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: gr_mapping
      CACHE_LOCAL_ENABLED: "false"
    depends_on:
      - evolution-postgres
      - evolution-redis
    ports:
      - "127.0.0.1:${EVOLUTION_PORT:-8080}:8080"
    volumes:
      - evolution_instances:/evolution/instances

  evolution-postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${EVOLUTION_DB_NAME}
      POSTGRES_USER: ${EVOLUTION_DB_USER}
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data

volumes:
  gr_mapping_data:
  evolution_instances:
  evolution_postgres_data:
  evolution_redis_data:
